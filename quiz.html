<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MID Quiz - Take Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <header><h1>MID Quiz</h1></header>
        <main>
            <h2 id="quiz-title">Take Quiz</h2>
            <p id="quiz-description">Choose one answer for each question.</p>
            <p id="quiz-message" role="status">Loading quiz...</p>
            <!-- Submission / grading will be connected in the next feature. -->
            <form action="submit-quiz.php" method="post" id="quiz-form" hidden>
                <input type="hidden" id="quiz-id" name="quiz_id">
                <div id="questions"></div>
                <p><button type="submit" disabled>Submit Quiz (coming soon)</button></p>
            </form>
            <p><a href="student-dashboard.html">Back to Student Dashboard</a></p>
        </main>
        <footer><p>MID Quiz - Student Quiz</p></footer>
    </div>
    <script>
        async function loadQuiz() {
            const id = new URLSearchParams(window.location.search).get("id");
            const form = document.getElementById("quiz-form");
            const message = document.getElementById("quiz-message");
            if (!id) {
                message.textContent = "No quiz was selected.";
                return;
            }
            try {
                const response = await fetch(
                    "get-quizzes.php?id=" + encodeURIComponent(id),
                    { credentials: "same-origin" }
                );
                const quiz = await response.json();
                if (!response.ok) throw new Error(quiz.error || "Quiz not available.");
                if (!Array.isArray(quiz.questions)) throw new Error("Invalid quiz data.");

                document.getElementById("quiz-title").textContent = quiz.title;
                document.getElementById("quiz-description").textContent =
                    quiz.description || "Choose one answer for each question.";
                document.getElementById("quiz-id").value = quiz.id;

                const container = document.getElementById("questions");
                quiz.questions.forEach((question, index) => {
                    const section = document.createElement("section");
                    const fieldset = document.createElement("fieldset");
                    const legend = document.createElement("legend");
                    legend.textContent = "Question " + (index + 1) + ": " + question.text;
                    fieldset.appendChild(legend);
                    ["A", "B", "C", "D"].forEach(letter => {
                        const label = document.createElement("label");
                        const radio = document.createElement("input");
                        radio.type = "radio";
                        radio.name = "answers[q" + (index + 1) + "]";
                        radio.value = letter;
                        radio.required = true;
                        label.append(radio, document.createTextNode(" " + letter + ". " +
                            (question.choices[letter] || "")));
                        fieldset.appendChild(label);
                    });
                    section.appendChild(fieldset);
                    container.appendChild(section);
                });
                form.hidden = false;
                message.textContent = "Quiz preview — submitting and grading will be added next.";
            } catch (error) {
                message.textContent = error.message;
            }
        }
        loadQuiz();
    </script>
</body>
</html>
