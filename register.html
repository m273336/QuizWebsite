<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MID Quiz - Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <header>
            <h1>MID Quiz</h1>
        </header>

        <main>
            <h2>Create an Account</h2>

            <form action="register-process.php" method="post">
                <!-- Choose whether to register as a student or a teacher. -->
                <label for="role">Account Type:</label>
                <select id="role" name="role" onchange="toggleTeacherCode()">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>

                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="full_name" required>

                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <!-- Only teachers should see this field. -->
                <div id="teacher-section" hidden>
                    <label for="teacher-code">Teacher Secret Code:</label>
                    <input type="password" id="teacher-code" name="teacher_code">
                </div>

                <p><button type="submit">Create Account</button></p>
            </form>

            <p>Already have an account? <a href="login.html">Login</a>.</p>
            <p><small>Account creation will work when the backend is connected.</small></p>
        </main>
    </div>

    <script>
        // Show the secret code field only when Teacher is selected. Teacher have access to secret code to register as a teacher.
        function toggleTeacherCode() {
            var isTeacher = document.getElementById("role").value === "teacher";
            var teacherSection = document.getElementById("teacher-section");
            var code = document.getElementById("teacher-code");

            teacherSection.hidden = !isTeacher;
            code.required = isTeacher;
            if (!isTeacher) {
                code.value = "";
            }
        }

        toggleTeacherCode();
    </script>
</body>

</html>
